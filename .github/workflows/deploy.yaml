name: Test, Build and Deploy with MicroK8s

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Tests + build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `pretest` genera environment.development.ts; sin .env usa el valor por defecto.
      - name: Unit tests
        run: npm test -- --watch=false

      - name: Production build
        run: npm run build

  build-and-publish:
    name: Build and Push Image to GHCR
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # GHCR exige el nombre en minúsculas: ghcr.io/docsjaveriana/ui-estudiante
      - name: Set IMAGE
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${IMAGE}:latest -t ${IMAGE}:${GITHUB_SHA::7} .

      - name: Push Docker image
        run: |
          docker push ${IMAGE}:latest
          docker push ${IMAGE}:${GITHUB_SHA::7}

      - name: Print pushed image URL
        run: 'echo "Imagen publicada: ${IMAGE}:latest (${GITHUB_SHA::7})"'

  deploy-onpremise:
    name: Deploy on MicroK8s On-Premise
    runs-on: self-hosted
    needs: build-and-publish
    if: github.event_name == 'push'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Usa el ghcr-secret del namespace estudiante, creado para el backend.
      - name: Apply Kubernetes deployment
        run: sudo microk8s kubectl apply -f k8s/dev/deployment.yaml

      # La imagen siempre es :latest: el restart fuerza a bajar la nueva (imagePullPolicy: Always).
      - name: Restart Kubernetes deployment
        run: sudo microk8s kubectl rollout restart deployment/ui-estudiante -n estudiante

      - name: Wait for rollout
        run: sudo microk8s kubectl rollout status deployment/ui-estudiante -n estudiante --timeout=3m
