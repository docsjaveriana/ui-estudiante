# La SPA se publica en https://desarrolloweb.click/estudiante/ (baseHref de producción).
# El Ingress reenvía /estudiante sin reescribir, así que nginx sirve esa misma ruta.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Detrás del Ingress (TLS terminado fuera): redirecciones relativas para conservar
  # el esquema y el host públicos.
  absolute_redirect off;

  location = /estudiante {
    return 301 /estudiante/;
  }

  # index.html nunca se cachea: así el navegador siempre ve la última versión.
  location = /estudiante/index.html {
    add_header Cache-Control "no-cache";
  }

  # Los bundles llevan hash en el nombre: se pueden cachear indefinidamente.
  location ~* ^/estudiante/.+\.(js|css|ico|png|svg|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Rutas del router de Angular (/estudiante/usuarios/1): si no es un archivo, index.html.
  location /estudiante/ {
    try_files $uri $uri/ /estudiante/index.html;
  }
}
